name: Remove existing entry / 刪除既有項目
description: Remove an item from the bilingual website.
title: "[Website: Remove] "
body:
  - type: markdown
    attributes:
      value: |
        從 `CONTENT-CATALOG.md` 或 `/admin/` 複製要刪除項目的 Entry ID。
  - type: input
    id: entry-id
    attributes:
      label: Entry ID / 項目 ID
    validations: {required: true}
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation / 確認
      options:
        - label: I understand this entry will be removed from both language versions. / 我知道這會從中英文網站刪除。
          required: true
