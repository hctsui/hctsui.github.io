name: Add honor or award / 新增獎項
description: Add an honor, scholarship, fellowship, or award.
title: "[Website: Add honor] "
body:
  - type: markdown
    attributes:
      value: |
        **欄位標示**
        - **[必填]**：送出前一定要填。
        - **[選填]**：可以留空；留空時網站不會輸出空白文字或按鈕。
        - **[可自動翻譯]**：中文可留空；系統會優先沿用既有譯名，再產生臺灣繁體中文草稿。
        - 日期一律使用 `YYYY-MM-DD`。
  - type: dropdown
    id: chinese-mode
    attributes:
      label: Chinese handling / 中文欄位處理 [必填]
      description: 建議使用自動翻譯；同系列會議與既有機構會優先沿用網站舊譯名。
      options:
        - Auto translate blank Chinese fields / 自動翻譯空白中文欄位
        - I will fill Chinese fields myself / 中文由我自行填寫
      default: 0
    validations: {required: true}
  - type: input
    id: year
    attributes:
      label: Year / 年份 [必填]
      placeholder: "2026"
    validations: {required: true}
  - type: input
    id: name-en
    attributes:
      label: Honor name (English) / 獎項英文名稱 [必填]
    validations: {required: true}
  - type: input
    id: name-zh
    attributes:
      label: Honor name (Chinese) / 獎項中文名稱 [選填・可自動翻譯]
  - type: input
    id: org-en
    attributes:
      label: Organization (English) / 頒發單位英文 [選填]
  - type: input
    id: org-zh
    attributes:
      label: Organization (Chinese) / 頒發單位中文 [選填・可自動翻譯]
  - type: input
    id: url
    attributes:
      label: Honor URL / 獎項連結 [選填]
