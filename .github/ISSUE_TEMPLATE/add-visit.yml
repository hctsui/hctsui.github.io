name: Add academic visit / 新增學術訪問
description: Add an academic visit, including optional funding information.
title: "[Website: Add visit] "
body:
  - type: markdown
    attributes:
      value: |
        **欄位標示**
        - **[必填]**：送出前一定要填。
        - **[選填]**：可以留空；留空時網站不會輸出空白文字或按鈕。
        - **[可自動翻譯]**：中文可留空；系統會優先沿用既有譯名，再產生臺灣繁體中文草稿。
        - 日期一律使用 `YYYY-MM-DD`。
  - type: dropdown
    id: chinese-mode
    attributes:
      label: Chinese handling / 中文欄位處理 [必填]
      description: 建議使用自動翻譯；同系列會議與既有機構會優先沿用網站舊譯名。
      options:
        - Auto translate blank Chinese fields / 自動翻譯空白中文欄位
        - I will fill Chinese fields myself / 中文由我自行填寫
      default: 0
    validations: {required: true}
  - type: input
    id: start-date
    attributes:
      label: Start date / 開始日期 [必填]
      placeholder: "2026-07-02"
    validations: {required: true}
  - type: input
    id: end-date
    attributes:
      label: End date / 結束日期 [選填]
      description: 單日訪問可留空，系統會使用開始日期。
      placeholder: "2026-08-30"
  - type: dropdown
    id: upcoming
    attributes:
      label: Show on Upcoming? / 是否先顯示於 Upcoming [必填]
      options: ["Yes / 是", "No / 否"]
      default: 1
    validations: {required: true}
  - type: input
    id: institution-en
    attributes:
      label: Institution (English) / 機構英文 [必填]
    validations: {required: true}
  - type: input
    id: institution-zh
    attributes:
      label: Institution (Chinese) / 機構中文 [選填・可自動翻譯]
  - type: input
    id: url
    attributes:
      label: Institution or visit URL / 機構或訪問連結 [選填]
  - type: input
    id: city-en
    attributes:
      label: City (English) / 城市英文 [選填]
  - type: input
    id: city-zh
    attributes:
      label: City (Chinese) / 城市中文 [選填・可自動翻譯]
  - type: input
    id: country-en
    attributes:
      label: Country (English) / 國家英文 [選填]
  - type: input
    id: country-zh
    attributes:
      label: Country (Chinese) / 國家中文 [選填・可自動翻譯]
  - type: input
    id: funding-en
    attributes:
      label: Funding note (English) / 補助說明英文 [選填]
      placeholder: "Supported by the Japan–Taiwan Exchange Association"
  - type: input
    id: funding-zh
    attributes:
      label: Funding note (Chinese) / 補助說明中文 [選填・可自動翻譯]
      placeholder: "獲日本台灣交流協會補助"
