name: Add teaching course / 新增教學課程
description: Add a teaching-assistant course to both language versions.
title: "[Website: Add teaching] "
body:
  - type: markdown
    attributes:
      value: |
        **欄位標示**
        - **[必填]**：送出前一定要填。
        - **[選填]**：可以留空；留空時網站不會輸出空白文字或按鈕。
        - **[可自動翻譯]**：中文可留空；系統會優先沿用既有譯名，再產生臺灣繁體中文草稿。
        - 日期一律使用 `YYYY-MM-DD`。
  - type: dropdown
    id: chinese-mode
    attributes:
      label: Chinese handling / 中文欄位處理 [必填]
      description: 建議使用自動翻譯；同系列會議與既有機構會優先沿用網站舊譯名。
      options:
        - Auto translate blank Chinese fields / 自動翻譯空白中文欄位
        - I will fill Chinese fields myself / 中文由我自行填寫
      default: 0
    validations: {required: true}
  - type: input
    id: term-en
    attributes:
      label: Term (English) / 學期英文 [必填]
      placeholder: "Fall 2026"
    validations: {required: true}
  - type: input
    id: term-zh
    attributes:
      label: Term (Chinese) / 學期中文 [選填・可自動翻譯]
      placeholder: "2026 秋"
  - type: input
    id: course-en
    attributes:
      label: Course (English) / 課程英文 [必填]
      placeholder: "MATH2410 Algebra I"
    validations: {required: true}
  - type: input
    id: course-zh
    attributes:
      label: Course (Chinese) / 課程中文 [選填・可自動翻譯]
      placeholder: "MATH2410 代數（一）"
  - type: dropdown
    id: top
    attributes:
      label: Place at top? / 是否放在最前面 [必填]
      options: ["Yes / 是", "No / 否"]
      default: 1
    validations: {required: true}
