name: Save website ordering / 儲存網站排序
description: Paste the ordering payload copied by the Admin page.
title: "[Website: Reorder] "
body:
  - type: markdown
    attributes:
      value: |
        請從 `/admin/` 進入網站排序模式，調整順序後按「儲存目前順序」。系統會複製完整排序資料並開啟本表單。
  - type: textarea
    id: ordering
    attributes:
      label: Ordering payload / 排序資料 [必填]
      description: 直接貼上 Admin 複製的 JSON；不要手動刪改 Entry ID。
      render: json
    validations:
      required: true
