name: Add talk / 新增學術報告
description: Add a talk, seminar, or conference presentation.
title: "[Website: Add talk] "
body:
  - type: markdown
    attributes:
      value: |
        填完送出後，網站會自動更新中英文版本。若題目中需要斜體，可寫 `[i]u[/i]`。
  - type: input
    id: date
    attributes:
      label: Talk date / 演講日期
      placeholder: "2026-07-06"
    validations: {required: true}
  - type: input
    id: end-date
    attributes:
      label: End date (optional) / 結束日期（選填）
      description: 一般單日演講不必填。
  - type: dropdown
    id: upcoming
    attributes:
      label: Show on Upcoming? / 是否先顯示於 Upcoming
      description: 結束日過後會自動移到學術報告列表。
      options: ["Yes / 是", "No / 否"]
      default: 0
    validations: {required: true}
  - type: input
    id: title-en
    attributes:
      label: Talk title (English) / 演講英文題目
    validations: {required: true}
  - type: input
    id: title-zh
    attributes:
      label: Talk title (Chinese) / 演講中文題目
    validations: {required: true}
  - type: input
    id: url
    attributes:
      label: Talk or event URL / 演講或活動連結
  - type: input
    id: event-en
    attributes:
      label: Event (English) / 活動英文名稱
      placeholder: "Tohoku University Number Theory Seminar"
  - type: input
    id: event-zh
    attributes:
      label: Event (Chinese) / 活動中文名稱
      placeholder: "東北大學數論研討會"
  - type: input
    id: institution-en
    attributes:
      label: Institution (English) / 機構英文
  - type: input
    id: institution-zh
    attributes:
      label: Institution (Chinese) / 機構中文
  - type: input
    id: city-en
    attributes:
      label: City (English) / 城市英文
  - type: input
    id: city-zh
    attributes:
      label: City (Chinese) / 城市中文
  - type: input
    id: country-en
    attributes:
      label: Country (English) / 國家英文
  - type: input
    id: country-zh
    attributes:
      label: Country (Chinese) / 國家中文
  - type: input
    id: slides
    attributes:
      label: Slides URL / 投影片連結
