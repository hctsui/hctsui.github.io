name: Add conference / 新增會議
description: Add a conference or workshop; it can appear in Upcoming first.
title: "[Website: Add conference] "
body:
  - type: markdown
    attributes:
      value: |
        填完送出後，網站會自動更新中英文版本。日期請使用 `YYYY-MM-DD`。
  - type: input
    id: start-date
    attributes:
      label: Start date / 開始日期
      placeholder: "2026-08-24"
    validations: {required: true}
  - type: input
    id: end-date
    attributes:
      label: End date / 結束日期
      description: 單日活動可留空，程式會使用開始日期。
      placeholder: "2026-08-28"
  - type: dropdown
    id: upcoming
    attributes:
      label: Show on Upcoming? / 是否先顯示於 Upcoming
      description: 選 Yes 時，結束日過後會自動移到會議列表。
      options: ["Yes / 是", "No / 否"]
      default: 0
    validations: {required: true}
  - type: input
    id: title-en
    attributes:
      label: Conference name (English) / 會議英文名稱
    validations: {required: true}
  - type: input
    id: title-zh
    attributes:
      label: Conference name (Chinese) / 會議中文名稱
    validations: {required: true}
  - type: input
    id: url
    attributes:
      label: Conference URL / 會議連結
      placeholder: "https://..."
  - type: input
    id: venue-en
    attributes:
      label: Venue (English) / 地點英文
      placeholder: "Nagoya University"
  - type: input
    id: venue-zh
    attributes:
      label: Venue (Chinese) / 地點中文
      placeholder: "名古屋大學"
  - type: input
    id: city-en
    attributes:
      label: City (English) / 城市英文
      placeholder: "Nagoya"
  - type: input
    id: city-zh
    attributes:
      label: City (Chinese) / 城市中文
      placeholder: "名古屋"
  - type: input
    id: country-en
    attributes:
      label: Country (English) / 國家英文
      placeholder: "Japan"
  - type: input
    id: country-zh
    attributes:
      label: Country (Chinese) / 國家中文
      placeholder: "日本"
