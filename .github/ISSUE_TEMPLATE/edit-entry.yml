name: Edit existing entry / 編輯既有項目
description: Change selected fields without manually editing HTML.
title: "[Website: Edit] "
body:
  - type: markdown
    attributes:
      value: |
        **欄位標示**
        - **[必填]**：送出前一定要填。
        - **[選填]**：可以留空；留空時網站不會輸出空白文字或按鈕。
        - **[可自動翻譯]**：中文可留空；系統會優先沿用既有譯名，再產生臺灣繁體中文草稿。
        - 日期一律使用 `YYYY-MM-DD`。
  - type: dropdown
    id: chinese-mode
    attributes:
      label: Chinese handling / 中文欄位處理 [必填]
      description: 建議使用自動翻譯；同系列會議與既有機構會優先沿用網站舊譯名。
      options:
        - Auto translate blank Chinese fields / 自動翻譯空白中文欄位
        - I will fill Chinese fields myself / 中文由我自行填寫
      default: 0
    validations: {required: true}
  - type: markdown
    attributes:
      value: 從 `/admin/` 複製 Entry ID。只填要修改的欄位，其餘留空。
  - type: input
    id: entry-id
    attributes:
      label: Entry ID / 項目 ID [必填]
    validations: {required: true}
  - type: input
    id: title-en
    attributes:
      label: New English title/name/course / 新英文題目、名稱或課名 [選填]
  - type: input
    id: title-zh
    attributes:
      label: New Chinese title/name/course / 新中文題目、名稱或課名 [選填・可自動翻譯]
  - type: input
    id: start
    attributes:
      label: New start/public date / 新開始或公開日期 [選填]
      placeholder: "YYYY-MM-DD"
  - type: input
    id: end
    attributes:
      label: New end date / 新結束日期 [選填]
      placeholder: "YYYY-MM-DD"
  - type: input
    id: year
    attributes:
      label: New year / 新年份 [選填]
      placeholder: "2026"
  - type: input
    id: url
    attributes:
      label: New main URL / 新主要連結 [選填]
  - type: textarea
    id: desc-en
    attributes:
      label: New English description/organization/term / 新英文說明、單位或學期 [選填]
  - type: textarea
    id: desc-zh
    attributes:
      label: New Chinese description/organization/term / 新中文說明、單位或學期 [選填・可自動翻譯]
  - type: input
    id: authors-en
    attributes:
      label: New authors (English) / 新作者英文 [選填]
  - type: input
    id: authors-zh
    attributes:
      label: New authors (Chinese) / 新作者中文 [選填・可自動翻譯]
  - type: input
    id: auxiliary
    attributes:
      label: New slides or PDF URL / 新投影片或 PDF 連結 [選填]

  - type: dropdown
    id: teaching-role
    attributes:
      label: New teaching role / 新教學身分 [選填]
      description: 只適用於教學項目。
      options:
        - Keep unchanged / 維持不變
        - Teaching Assistant / 助教
        - Lecturer / 講師
        - Other / 其他（下方自訂）
      default: 0
  - type: input
    id: custom-role-en
    attributes:
      label: New custom role (English) / 新自訂身分英文 [選填]
      description: 上方選 Other 時填寫。
  - type: input
    id: custom-role-zh
    attributes:
      label: New custom role (Chinese) / 新自訂身分中文 [選填・可自動翻譯]
  - type: input
    id: institution-en
    attributes:
      label: New institution (English or shortcut) / 新機構英文或簡寫 [選填]
      description: 只適用於教學項目，例如 NTHU。
  - type: input
    id: institution-zh
    attributes:
      label: New institution (Chinese) / 新機構中文 [選填・可自動翻譯]
  - type: dropdown
    id: upcoming
    attributes:
      label: Upcoming setting / Upcoming 設定 [選填]
      options: ["Keep unchanged / 維持不變", "Yes / 是", "No / 否"]
      default: 0
