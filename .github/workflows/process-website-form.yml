name: Process website form

on:
  issues:
    types: [opened]

concurrency:
  group: hctsui-website-update
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  issues: write
  pages: write
  id-token: write
  models: read

jobs:
  update-site:
    if: >-
      startsWith(github.event.issue.title, '[Website:') &&
      github.event.issue.author_association == 'OWNER'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out cms branch
        uses: actions/checkout@v6
        with:
          ref: cms
          fetch-depth: 0

      - name: Process form
        id: process
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRANSLATION_MODEL: openai/gpt-4o-mini
        run: |
          python3 tools/process_request.py "$GITHUB_EVENT_PATH" --result-file /tmp/result.json
          echo "entry_id=$(python3 -c 'import json; print(json.load(open("/tmp/result.json"))["entry_id"])')" >> "$GITHUB_OUTPUT"
          echo "action=$(python3 -c 'import json; print(json.load(open("/tmp/result.json"))["action"])')" >> "$GITHUB_OUTPUT"

      - name: Rebuild website and LaTeX CV
        run: |
          python3 tools/build_site.py
          python3 tools/build_cv.py
          python3 tools/update_cv_links.py
          python3 tools/build_catalog.py
          python3 tools/validate_site.py

      - name: Compile PDF CV
        uses: xu-cheng/latex-action@v4
        with:
          root_file: cv/Hung-Chun-Tsui-CV.tex
          texlive_version: 2025
          os: debian

      - name: Stage PDF for the website
        run: |
          mkdir -p files
          cp cv/Hung-Chun-Tsui-CV.pdf files/Hung-Chun-Tsui-CV.pdf

      - name: Commit website and LaTeX source update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/site.json CONTENT-CATALOG.md \
            cv/Hung-Chun-Tsui-CV.tex \
            index.html cv.html publications.html activities.html teaching.html \
            zh/index.html zh/cv.html zh/publications.html zh/activities.html zh/teaching.html
          if git diff --cached --quiet; then
            echo "No file change was required."
          else
            git commit -m "Update website content: ${{ steps.process.outputs.entry_id }}"
            git push origin HEAD:cms
          fi

      - name: Prepare public website
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html cv.html publications.html activities.html teaching.html photo.jpg _site/
          cp -R assets zh admin content files _site/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Confirm and close form
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          result = json.load(open('/tmp/result.json', encoding='utf-8'))
          lines = [
              f"完成：{result['action']}。中英文網頁、LaTeX CV、PDF CV、排序、Last updated 與網站部署都已自動處理。",
              "",
              f"Entry ID: `{result['entry_id']}`",
              "",
              "PDF CV: https://hctsui.github.io/files/Hung-Chun-Tsui-CV.pdf",
          ]
          if result.get('notes'):
              lines += ["", "### 智慧處理", *[f"- {x}" for x in result['notes']]]
          if result.get('warnings'):
              lines += ["", "### 請留意", *[f"- {x}" for x in result['warnings']]]
          open('/tmp/comment.md','w',encoding='utf-8').write('\n'.join(lines))
          PY
          gh issue comment "${{ github.event.issue.number }}" --body-file /tmp/comment.md
          gh issue close "${{ github.event.issue.number }}"

      - name: Explain failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --body "自動更新失敗，這個表單暫時不會關閉。請打開本次 Actions 的第一個紅色步驟；若是 Compile PDF CV，錯誤訊息會指出 LaTeX 的確切行號。"
