name: Process website form

on:
  issues:
    types: [opened]

concurrency:
  group: hctsui-content-update
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  issues: write
  pages: write
  id-token: write
  models: read

jobs:
  update-site:
    if: >-
      startsWith(github.event.issue.title, '[Website:') &&
      github.event.issue.author_association == 'OWNER'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      entry_id: ${{ steps.process.outputs.entry_id }}
      action: ${{ steps.process.outputs.action }}
      result_b64: ${{ steps.process.outputs.result_b64 }}

    steps:
      - name: Check out cms branch
        uses: actions/checkout@v6
        with:
          ref: cms
          fetch-depth: 0

      - name: Process form
        id: process
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRANSLATION_MODEL: openai/gpt-4o-mini
        run: |
          python3 tools/process_request_v3.py "$GITHUB_EVENT_PATH" --result-file /tmp/result.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import base64
          import json

          path = "/tmp/result.json"
          result = json.load(open(path, encoding="utf-8"))
          encoded = base64.b64encode(
              json.dumps(result, ensure_ascii=False).encode("utf-8")
          ).decode("ascii")
          print(f"entry_id={result['entry_id']}")
          print(f"action={result['action']}")
          print(f"result_b64={encoded}")
          PY

      - name: Rebuild website and LaTeX source
        run: |
          python3 tools/build_site.py
          python3 tools/build_cv.py
          python3 tools/enhance_teaching.py
          python3 tools/update_cv_links.py
          python3 tools/build_catalog.py
          python3 tools/validate_site.py
          test -s cv/Hung-Chun-Tsui-CV.tex

      - name: Commit website and LaTeX source update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/site.json CONTENT-CATALOG.md \
            cv/Hung-Chun-Tsui-CV.tex \
            index.html cv.html publications.html activities.html teaching.html \
            zh/index.html zh/cv.html zh/publications.html zh/activities.html zh/teaching.html
          if git diff --cached --quiet; then
            echo "No file change was required."
          else
            git commit -m "Update website content: ${{ steps.process.outputs.entry_id }}"
            git push origin HEAD:cms
          fi

  deploy-site:
    needs: update-site
    uses: ./.github/workflows/deploy-cms-pages.yml

  confirm:
    needs: [update-site, deploy-site]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Confirm and close form
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_B64: ${{ needs.update-site.outputs.result_b64 }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os

          result = json.loads(base64.b64decode(os.environ["RESULT_B64"]).decode("utf-8"))
          lines = [
              f"完成：{result['action']}。中英文網頁、LaTeX CV、PDF CV、排序、Last updated 與網站部署都已自動處理。",
              "",
              f"Entry ID: `{result['entry_id']}`",
              "",
              "PDF CV: https://hctsui.github.io/files/Hung-Chun-Tsui-CV.pdf",
          ]
          if result.get("notes"):
              lines += ["", "### 智慧處理", *[f"- {x}" for x in result["notes"]]]
          if result.get("warnings"):
              lines += ["", "### 請留意", *[f"- {x}" for x in result["warnings"]]]
          open("/tmp/comment.md", "w", encoding="utf-8").write("\n".join(lines))
          PY
          if ! gh api --method POST \
            "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" \
            -F body=@/tmp/comment.md >/dev/null; then
            echo "::warning::網站已更新，但無法在 Issue 留下完成訊息。"
          fi
          if ! gh api --method PATCH \
            "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}" \
            -f state=closed >/dev/null; then
            echo "::warning::網站已更新，但無法自動關閉 Issue。"
          fi

  explain-failure:
    if: >-
      always() &&
      (needs.update-site.result == 'failure' ||
       needs.update-site.result == 'cancelled' ||
       needs.deploy-site.result == 'failure' ||
       needs.deploy-site.result == 'cancelled')
    needs: [update-site, deploy-site]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Explain failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" \
            -f body="自動更新失敗，表單暫時不會關閉。請查看本次 Actions 的第一個紅色步驟。" \
            >/dev/null || echo "::warning::無法在 Issue 留下失敗訊息。"
