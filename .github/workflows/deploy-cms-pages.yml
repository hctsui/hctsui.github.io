name: Deploy cms website

on:
  push:
    branches: [cms]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out cms branch
        uses: actions/checkout@v4
        with:
          ref: cms

      - name: Prepare public website
        run: |

          rm -rf _site
          mkdir -p _site
          cp index.html cv.html publications.html activities.html teaching.html photo.jpg _site/
          cp -R assets zh admin _site/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
