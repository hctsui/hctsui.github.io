name: Deploy cms website

on:
  push:
    branches: [cms]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: hctsui-pages-deploy
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out cms branch
        uses: actions/checkout@v6
        with:
          ref: cms

      - name: Verify CV automation files
        run: |
          test -f content/site.json
          test -f tools/build_site.py
          test -f tools/build_cv.py
          test -f tools/update_cv_links.py
          test -f tools/validate_site.py
          test -f cv/Hung-Chun-Tsui-CV.template.tex

      - name: Rebuild website and LaTeX CV
        run: |
          python3 tools/build_site.py
          python3 tools/build_cv.py
          python3 tools/update_cv_links.py
          python3 tools/validate_site.py
          test -s cv/Hung-Chun-Tsui-CV.tex

      - name: Compile PDF CV
        uses: xu-cheng/latex-action@v4
        with:
          root_file: cv/Hung-Chun-Tsui-CV.tex
          texlive_version: 2025
          os: debian

      - name: Stage PDF for the website
        run: |
          test -s cv/Hung-Chun-Tsui-CV.pdf
          mkdir -p files
          cp cv/Hung-Chun-Tsui-CV.pdf files/Hung-Chun-Tsui-CV.pdf

      - name: Prepare public website
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html cv.html publications.html activities.html teaching.html photo.jpg _site/
          cp -R assets zh admin content files _site/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
