name: Clean old notifications

on:
  schedule:
    - cron: "10 8 * * 0"
      timezone: "Asia/Tokyo"
  workflow_dispatch:

concurrency:
  group: hctsui-automation-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out cms branch
        uses: actions/checkout@v6
        with:
          ref: refs/heads/cms
          fetch-depth: 0
          clean: true

      - name: Run regression tests
        run: python3 -m unittest discover -s tests

      - name: Remove old unstarred notifications
        run: python3 tools/cleanup_notifications.py

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- content/notifications.json content/arxiv-suggestions.json; then
            echo "No notifications need cleanup."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/notifications.json content/arxiv-suggestions.json
          git commit -m "Clean old notifications"
          git pull --rebase origin cms
          git push origin HEAD:cms
