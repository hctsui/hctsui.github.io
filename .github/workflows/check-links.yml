name: Check managed links

on:
  schedule:
    - cron: "20 10 1 * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:

concurrency:
  group: hctsui-automation-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out cms branch
        uses: actions/checkout@v6
        with:
          ref: refs/heads/cms
          fetch-depth: 0
          clean: true

      - name: Check managed external links
        run: python3 tools/check_links.py

      - name: Validate notification data
        run: python3 -m unittest discover -s tests

      - name: Commit link notifications
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- content/notifications.json; then
            echo "No link notification changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/notifications.json
          git commit -m "Update broken-link notifications"
          git pull --rebase origin cms
          git push origin HEAD:cms
