name: Move expired Upcoming entries

on:
  schedule:
    # 00:15 in Japan/Taiwan time (15:15 UTC on the previous date)
    - cron: "15 15 * * *"
  workflow_dispatch:

concurrency:
  group: hctsui-daily-content-update
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  update-upcoming:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.changes.outputs.changed }}

    steps:
      - name: Check out cms branch
        uses: actions/checkout@v6
        with:
          ref: cms
          fetch-depth: 0

      - name: Rebuild using today's date
        run: |
          python3 -m unittest discover -s tests
          python3 tools/build_site.py
          python3 tools/build_cv.py
          python3 tools/render_grouped_sections.py
          python3 tools/build_dynamic_forms.py
          python3 tools/update_cv_links.py
          python3 tools/build_catalog.py
          python3 tools/validate_translations.py
          python3 tools/validate_site.py

      - name: Detect whether generated content changed
        id: changes
        run: |
          if [ -z "$(git status --porcelain -- \
            CONTENT-CATALOG.md \
            cv/Hung-Chun-Tsui-CV.tex cv/Hung-Chun-Tsui-CV-zh.tex \
            '*.html' 'zh/*.html' \
            .github/ISSUE_TEMPLATE/add-conference.yml \
            .github/ISSUE_TEMPLATE/add-talk.yml \
            .github/ISSUE_TEMPLATE/add-visit.yml \
            .github/ISSUE_TEMPLATE/add-honor.yml \
            .github/ISSUE_TEMPLATE/add-publication.yml \
            .github/ISSUE_TEMPLATE/add-teaching.yml \
            .github/ISSUE_TEMPLATE/edit-entry.yml \
            .github/ISSUE_TEMPLATE/reorder-entries.yml)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No generated content changed today."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CONTENT-CATALOG.md \
            cv/Hung-Chun-Tsui-CV.tex cv/Hung-Chun-Tsui-CV-zh.tex \
            '*.html' 'zh/*.html' \
            .github/ISSUE_TEMPLATE/add-conference.yml \
            .github/ISSUE_TEMPLATE/add-talk.yml \
            .github/ISSUE_TEMPLATE/add-visit.yml \
            .github/ISSUE_TEMPLATE/add-honor.yml \
            .github/ISSUE_TEMPLATE/add-publication.yml \
            .github/ISSUE_TEMPLATE/add-teaching.yml \
            .github/ISSUE_TEMPLATE/edit-entry.yml \
            .github/ISSUE_TEMPLATE/reorder-entries.yml
          git commit -m "Rebuild website, bilingual forms, and both CVs"
          git push origin HEAD:cms

  deploy-site:
    if: needs.update-upcoming.outputs.changed == 'true'
    needs: update-upcoming
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-cms-pages.yml
