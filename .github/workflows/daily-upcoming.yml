name: Daily website update (Admin-configured time and timezone)

on:
  # AUTO_DAILY_SCHEDULE_BEGIN -- managed from Admin > 自動更新
  schedule:
    - cron: "15 0 * * *"
      timezone: "Asia/Tokyo"
  # AUTO_DAILY_SCHEDULE_END
  workflow_dispatch:

concurrency:
  group: hctsui-daily-content-update
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  update-upcoming:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
    outputs:
      changed: ${{ steps.changes.outputs.changed }}

    steps:
      - name: Check out cms branch
        uses: actions/checkout@v6
        with:
          ref: cms
          fetch-depth: 0

      - name: Check editable time and timezone
        id: due
        env:
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 tools/daily_update_schedule.py check

      - name: Rebuild at configured local time
        if: steps.due.outputs.run == 'true'
        run: |
          python3 -m unittest discover -s tests
          python3 tools/run_with_extensions.py tools/build_site.py
          python3 tools/build_dossier.py
          python3 tools/inject_prefetch.py
          python3 tools/inject_profile_assets.py
          python3 tools/build_media_manifest.py
          python3 tools/build_search_index.py
          python3 tools/run_with_extensions.py tools/build_cv.py
          python3 tools/run_with_extensions.py tools/render_grouped_sections.py
          python3 tools/update_cv_links.py
          python3 tools/run_with_extensions.py tools/build_catalog.py
          python3 tools/validate_translations.py
          python3 tools/run_validate_site.py
          python3 tools/daily_update_schedule.py mark

      - name: Detect whether generated content changed
        if: steps.due.outputs.run == 'true'
        id: changes
        run: |
          if [ -z "$(git status --porcelain -- \
            CONTENT-CATALOG.md \
            content/media.json content/search-index.json content/daily-update-state.json \
            cv/Hung-Chun-Tsui-CV.tex cv/Hung-Chun-Tsui-CV-zh.tex \
            '*.html' 'zh/*.html')" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No generated content changed today."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated changes
        if: steps.due.outputs.run == 'true' && steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CONTENT-CATALOG.md \
            content/media.json content/search-index.json content/daily-update-state.json \
            cv/Hung-Chun-Tsui-CV.tex cv/Hung-Chun-Tsui-CV-zh.tex \
            '*.html' 'zh/*.html'
          git commit -m "Rebuild website at configured daily time"
          git push origin HEAD:cms

      - name: Publish generated changes
        if: steps.due.outputs.run == 'true' && steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-cms-pages.yml --ref cms
