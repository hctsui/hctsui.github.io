<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>HC Tsui Website Manager</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#2d2926;background:#f7f3ed;line-height:1.55}*{box-sizing:border-box}body{margin:0}.wrap{width:min(1180px,calc(100% - 36px));margin:0 auto;padding:48px 0 72px}header{margin-bottom:32px}h1{font-family:Georgia,serif;font-size:clamp(2rem,5vw,3.6rem);line-height:1.05;margin:.3rem 0 1rem}h2{font-family:Georgia,serif;margin-top:2.2rem}.eyebrow{font-size:.78rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#8d493d}.lead{max-width:800px;color:#625b56}.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:28px 0}.button{display:block;padding:15px 17px;border:1px solid #cdbeb3;border-radius:14px;text-decoration:none;color:#2d2926;background:#fff;box-shadow:0 8px 20px rgba(61,43,35,.05);font-weight:700}.button:hover{border-color:#8d493d;transform:translateY(-1px)}.secondary{background:transparent}.panel{background:#fff;border:1px solid #ded3ca;border-radius:18px;padding:20px;box-shadow:0 12px 28px rgba(61,43,35,.06)}.toolbar{display:flex;gap:14px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}.toolbar-title{min-width:220px}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.control{display:grid;gap:4px}.control label{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#746960}.toolbar input,.toolbar select{min-width:190px;padding:10px 12px;border:1px solid #cfc4bb;border-radius:10px;background:#fff;color:#2d2926;font:inherit}.toolbar input{min-width:min(100%,300px)}.status{font-size:.9rem;color:#756c66}.table-wrap{overflow:auto;margin-top:14px}table{width:100%;border-collapse:collapse;font-size:.92rem}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid #eee6df;vertical-align:top}th{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:#746960}.id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.78rem;word-break:break-all}.row-actions{white-space:nowrap}.small-button{border:1px solid #cfc4bb;background:#fff;border-radius:8px;padding:6px 9px;cursor:pointer;font:inherit;font-size:.8rem;margin:0 3px 4px 0}.small-button:hover{border-color:#8d493d}.danger{color:#8d2f25;border-color:#d9aaa4}.danger:hover{background:#fff4f2;border-color:#8d2f25}.note{padding:14px 16px;border-left:4px solid #8d493d;background:#f2e8e2;border-radius:8px;margin-top:22px}.flash{position:fixed;right:18px;bottom:18px;max-width:min(420px,calc(100% - 36px));padding:12px 15px;border-radius:12px;background:#2d2926;color:#fff;box-shadow:0 12px 30px rgba(0,0,0,.18);opacity:0;transform:translateY(8px);pointer-events:none;transition:.18s}.flash.show{opacity:1;transform:translateY(0)}@media(max-width:760px){.wrap{width:min(100% - 24px,1180px);padding-top:28px}.controls{width:100%}.control,.toolbar input,.toolbar select{width:100%;min-width:0}th:nth-child(4),td:nth-child(4){display:none}.row-actions{white-space:normal}}
</style>
</head>
<body>
<main class="wrap">
<header>
<p class="eyebrow">Private workflow · public page</p>
<h1>網站內容管理</h1>
<p class="lead">不必改 HTML。新增、編輯與刪除表單都會在新分頁開啟，這個管理頁會保留。下方目錄可以依類別篩選並自由選擇排序方式。</p>
</header>
<section>
<h2>新增內容</h2>
<div class="actions">
<a class="button" target="_blank" rel="noopener" href="https://github.com/hctsui/hctsui.github.io/issues/new?template=add-conference.yml">新增會議／工作坊</a>
<a class="button" target="_blank" rel="noopener" href="https://github.com/hctsui/hctsui.github.io/issues/new?template=add-talk.yml">新增學術報告</a>
<a class="button" target="_blank" rel="noopener" href="https://github.com/hctsui/hctsui.github.io/issues/new?template=add-visit.yml">新增學術訪問</a>
<a class="button" target="_blank" rel="noopener" href="https://github.com/hctsui/hctsui.github.io/issues/new?template=add-honor.yml">新增獎項／榮譽</a>
<a class="button" target="_blank" rel="noopener" href="https://github.com/hctsui/hctsui.github.io/issues/new?template=add-publication.yml">新增論文／預印本</a>
<a class="button" target="_blank" rel="noopener" href="https://github.com/hctsui/hctsui.github.io/issues/new?template=add-teaching.yml">新增教學課程</a>
</div>
<h2>編輯或刪除</h2>
<div class="actions">
<a class="button secondary" target="_blank" rel="noopener" href="https://github.com/hctsui/hctsui.github.io/issues/new?template=edit-entry.yml">編輯既有項目</a>
<a class="button secondary" target="_blank" rel="noopener" href="https://github.com/hctsui/hctsui.github.io/issues/new?template=remove-entry.yml">刪除既有項目</a>
<a class="button secondary" target="_blank" rel="noopener" href="https://github.com/hctsui/hctsui.github.io/blob/cms/MANAGE-WEBSITE.md">查看完整說明</a>
</div>
</section>
<section class="panel">
<div class="toolbar">
<div class="toolbar-title"><h2 style="margin:0">項目 ID 目錄</h2><div class="status" id="status">正在讀取資料……</div></div>
<div class="controls">
<div class="control"><label for="search">搜尋</label><input id="search" type="search" placeholder="標題、日期、機構或 ID"></div>
<div class="control"><label for="category">類別</label><select id="category"><option value="all">全部類別</option><option value="conference">會議／工作坊</option><option value="talk">演講</option><option value="visit">學術訪問</option><option value="honor">獎項</option><option value="publication">論文</option><option value="teaching">教學</option></select></div>
<div class="control"><label for="sort">排序</label><select id="sort"><option value="category">依類別（預設）</option><option value="database">資料庫原始順序</option><option value="newest">日期新到舊</option><option value="oldest">日期舊到新</option><option value="title">名稱</option><option value="id">Entry ID</option></select></div>
</div>
</div>
<div class="table-wrap"><table><thead><tr><th>類型</th><th>日期／學期</th><th>名稱</th><th>Entry ID</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div>
</section>
<p class="note"><strong>操作方式：</strong>按「編輯」或「刪除」時，系統會先複製該筆 Entry ID，再於新分頁開啟對應表單。貼上 ID 後即可送出。</p>
</main>
<div class="flash" id="flash" role="status" aria-live="polite"></div>
<script>
const repo='https://github.com/hctsui/hctsui.github.io';
const rows=document.querySelector('#rows');
const statusEl=document.querySelector('#status');
const search=document.querySelector('#search');
const category=document.querySelector('#category');
const sort=document.querySelector('#sort');
const flash=document.querySelector('#flash');
let records=[];
const labels={conference:'會議',talk:'演講',visit:'訪問',honor:'獎項',publication:'論文',teaching:'教學'};
const typeRank={conference:0,talk:1,visit:2,honor:3,publication:4,teaching:5};
function bilingual(obj){return obj?.zh||obj?.en||''}
function allBilingual(obj){return [obj?.zh,obj?.en].filter(Boolean).join(' ')}
function dateText(x){if(x.type==='honor')return String(x.year||'');if(x.type==='publication')return x.date||'';if(x.type==='teaching')return bilingual(x.term);return [x.start_date,x.end_date].filter(Boolean).join(' – ')}
function dateKey(x){if(x.type==='honor')return `${x.year||''}-01-01`;if(x.type==='publication')return x.date||'';if(x.type==='teaching')return String(x.order??'').padStart(8,'0');return x.start_date||''}
function titleText(x){return bilingual(x.title)||bilingual(x.course)}
function searchable(x){return [x.type,labels[x.type],dateText(x),allBilingual(x.title),allBilingual(x.course),allBilingual(x.role),allBilingual(x.institution),allBilingual(x.organization),allBilingual(x.description),x.id].join(' ').toLowerCase()}
function compare(a,b,mode){if(mode==='database')return a._index-b._index;if(mode==='category')return (typeRank[a.type]??99)-(typeRank[b.type]??99)||a._index-b._index;if(mode==='newest')return dateKey(b).localeCompare(dateKey(a))||a._index-b._index;if(mode==='oldest')return dateKey(a).localeCompare(dateKey(b))||a._index-b._index;if(mode==='title')return titleText(a).localeCompare(titleText(b),'zh-Hant')||a._index-b._index;if(mode==='id')return String(a.id).localeCompare(String(b.id));return a._index-b._index}
function cell(text,className=''){const td=document.createElement('td');td.textContent=text||'';if(className)td.className=className;return td}
function button(text,action,id,className=''){const b=document.createElement('button');b.type='button';b.className=`small-button ${className}`.trim();b.dataset.action=action;b.dataset.id=id;b.textContent=text;return b}
function showFlash(message){flash.textContent=message;flash.classList.add('show');clearTimeout(showFlash.timer);showFlash.timer=setTimeout(()=>flash.classList.remove('show'),2200)}
async function copyId(id){try{await navigator.clipboard.writeText(id)}catch{const area=document.createElement('textarea');area.value=id;area.style.position='fixed';area.style.opacity='0';document.body.append(area);area.select();document.execCommand('copy');area.remove()}}
function render(){const q=search.value.trim().toLowerCase();const chosen=category.value;rows.replaceChildren();const filtered=records.filter(x=>(chosen==='all'||x.type===chosen)&&(!q||searchable(x).includes(q))).sort((a,b)=>compare(a,b,sort.value));for(const x of filtered){const tr=document.createElement('tr');tr.append(cell(labels[x.type]||x.type),cell(dateText(x)),cell(titleText(x)),cell(x.id,'id'));const actions=document.createElement('td');actions.className='row-actions';actions.append(button('複製 ID','copy',x.id),button('編輯','edit',x.id),button('刪除','remove',x.id,'danger'));tr.append(actions);rows.append(tr)}statusEl.textContent=`顯示 ${filtered.length}／${records.length} 筆資料`}
fetch('../content/site.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(data=>{records=[...(data.activities||[]),...(data.honors||[]),...(data.publications||[]),...(data.teaching||[])].map((x,i)=>({...x,_index:i}));sort.value=localStorage.getItem('admin-sort')||'category';category.value=localStorage.getItem('admin-category')||'all';render()}).catch(()=>statusEl.textContent='讀取失敗。請從正式 GitHub Pages 網址開啟這個管理頁。');
search.addEventListener('input',render);category.addEventListener('change',()=>{localStorage.setItem('admin-category',category.value);render()});sort.addEventListener('change',()=>{localStorage.setItem('admin-sort',sort.value);render()});
rows.addEventListener('click',async e=>{const b=e.target.closest('button[data-id]');if(!b)return;const id=b.dataset.id;await copyId(id);if(b.dataset.action==='edit'){showFlash('已複製 Entry ID，正在開啟編輯表單');window.open(repo+'/issues/new?template=edit-entry.yml','_blank','noopener');return}if(b.dataset.action==='remove'){showFlash('已複製 Entry ID，正在開啟刪除表單');window.open(repo+'/issues/new?template=remove-entry.yml','_blank','noopener');return}const old=b.textContent;b.textContent='已複製';showFlash('Entry ID 已複製');setTimeout(()=>b.textContent=old,1200)});
</script>
</body>
</html>
