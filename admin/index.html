<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>HC Tsui Batch Website Manager</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#292522;background:#f7f3ed;line-height:1.5}*{box-sizing:border-box}body{margin:0}.wrap{width:min(1320px,calc(100% - 28px));margin:auto;padding:32px 0 70px}h1,h2,h3{font-family:Georgia,serif}.grid{display:grid;grid-template-columns:minmax(300px,1fr) minmax(420px,1.45fr);gap:18px}.panel{background:#fff;border:1px solid #ded3ca;border-radius:18px;padding:18px;box-shadow:0 10px 28px #3d2b2310}.toolbar,.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:end}.field{display:grid;gap:4px;margin:9px 0}.field label{font-size:.78rem;font-weight:800;color:#6f6259}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #cfc4bb;border-radius:9px;background:#fff;font:inherit}.field textarea{min-height:90px;font-family:ui-monospace,monospace}.button{border:1px solid #c7b8ad;background:#fff;border-radius:9px;padding:9px 12px;font:inherit;font-weight:700;cursor:pointer}.primary{background:#292522;color:#fff}.danger{color:#8d2f25}.muted{color:#746b65;font-size:.9rem}.records,.drafts{max-height:520px;overflow:auto}.row{padding:10px 0;border-bottom:1px solid #eee6df}.row strong{display:block}.tag{display:inline-block;padding:2px 7px;border-radius:999px;background:#f0e6df;font-size:.75rem}.diff{border-left:4px solid #8d493d;background:#faf6f2;padding:10px;margin:8px 0;border-radius:8px}.added{border-color:#247a46}.deleted{border-color:#a1342b}.json{white-space:pre-wrap;word-break:break-word;font:12px ui-monospace,monospace;background:#201d1b;color:#f8f4ef;padding:12px;border-radius:10px;max-height:380px;overflow:auto}.flash{position:fixed;right:16px;bottom:16px;background:#292522;color:#fff;padding:10px 14px;border-radius:10px;display:none}.tabs button.active{background:#292522;color:#fff}@media(max-width:900px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap">
<p class="muted">Local batch draft · one GitHub submission</p><h1>網站批次管理</h1>
<p>所有新增、修改、刪除先保存在這台裝置。送出前可以檢查自動補全、完整物件與差異；最後只建立一張 GitHub Issue。</p>
<div class="grid">
<section class="panel">
<div class="tabs actions"><button class="button active" data-tab="catalog">項目</button><button class="button" data-tab="add">新增</button><button class="button" data-tab="draft">草稿</button></div>
<div id="catalogTab"><div class="toolbar"><div class="field" style="flex:1"><label>搜尋</label><input id="search"></div><div class="field"><label>類別</label><select id="filter"><option value="">全部</option></select></div></div><div id="records" class="records"></div></div>
<div id="addTab" hidden><div class="field"><label>類別</label><select id="addType"></select></div><div id="addFields"></div><button class="button primary" id="addDraft">加入草稿</button></div>
<div id="draftTab" hidden><div id="drafts" class="drafts"></div><div class="actions"><button class="button danger" id="clearDraft">清空草稿</button></div></div>
</section>
<section class="panel">
<h2>預覽與送出</h2><div id="summary" class="muted">尚無變更。</div><div id="preview"></div>
<h3>批次資料</h3><pre id="payload" class="json">{}</pre>
<div class="actions"><button class="button" id="copyPayload">複製 JSON</button><button class="button primary" id="submitBatch">一鍵開啟 GitHub 批次送出</button></div>
<p class="muted">一般大小會直接預填 Issue；資料太大時會自動複製 JSON，開啟單欄批次表單，只需貼一次。</p>
</section></div></main><div class="flash" id="flash"></div>
<script>
const repo='https://github.com/hctsui/hctsui.github.io', TYPES=['conference','talk','visit','honor','publication','teaching'];
const Z={conference:'會議／工作坊',talk:'學術報告',visit:'學術訪問',honor:'獎項／榮譽',publication:'論文／作品',teaching:'教學'};
const section=t=>['conference','talk','visit'].includes(t)?'activities':t==='honor'?'honors':t==='publication'?'publications':'teaching';
let site,dict={en:new Map,zh:new Map},records=[],draft=JSON.parse(localStorage.getItem('hctsui-batch-v1')||'[]');
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function flash(s){$('#flash').textContent=s;$('#flash').style.display='block';setTimeout(()=>$('#flash').style.display='none',2500)}
function norm(s){return String(s||'').normalize('NFKC').trim().replace(/\s+/g,' ').toLowerCase()}
function term(en,zh){if(en&&!zh){let m=en.match(/^(Spring|Summer|Fall|Autumn|Winter)\s+(\d{4})$/i);if(m)zh=`${m[2]} ${{Spring:'春',Summer:'夏',Fall:'秋',Autumn:'秋',Winter:'冬'}[m[1][0].toUpperCase()+m[1].slice(1).toLowerCase()]}`}if(zh&&!en){let m=zh.match(/^(\d{4})\s*(春季?|夏季?|秋季?|冬季?)$/);if(m)en=`${{春:'Spring','春季':'Spring',夏:'Summer','夏季':'Summer',秋:'Fall','秋季':'Fall',冬:'Winter','冬季':'Winter'}[m[2]]} ${m[1]}`}return{en,zh}}
function pair(en,zh,isTerm=false){en=(en||'').trim();zh=(zh||'').trim();if(isTerm)({en,zh}=term(en,zh));if(en&&!zh)zh=dict.en.get(norm(en))||'';else if(zh&&!en)en=dict.zh.get(norm(zh))||'';return{en,zh}}
function htmlPair(p){return{en:esc(p.en),zh:esc(p.zh)}}
function slug(s){return norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,48)||'entry'}
function uid(t,anchor,title){let b=`${t}-${anchor}-${slug(title)}`;let ids=new Set(records.map(x=>x.id).concat(draft.map(x=>x.after?.id)));let n=2,r=b;while(ids.has(r))r=`${b}-${n++}`;return r}
function allRecords(d){return [...(d.activities||[]),...(d.honors||[]),...(d.publications||[]),...(d.teaching||[])]}
function effective(){let d=structuredClone(site);for(const op of draft){let a=d[section(op.type)]||[];if(op.op==='delete')d[section(op.type)]=a.filter(x=>x.id!==op.id);else if(op.op==='update'){let i=a.findIndex(x=>x.id===op.id);if(i>=0)a[i]=structuredClone(op.after)}else a.push(structuredClone(op.after))}return d}
const schemas={
conference:[['start_date','開始日期','date'],['end_date','結束日期','date'],['title.en','英文名稱'],['title.zh','中文名稱'],['venue.en','英文地點'],['venue.zh','中文地點'],['city.en','英文城市'],['city.zh','中文城市'],['country.en','英文國家'],['country.zh','中文國家'],['url','URL'],['show_upcoming','顯示 Upcoming','checkbox']],
talk:[['start_date','演講日期','date'],['end_date','結束日期','date'],['title.en','英文題目'],['title.zh','中文題目'],['event.en','英文活動／研討會'],['event.zh','中文活動／研討會'],['venue.en','英文機構'],['venue.zh','中文機構'],['city.en','英文城市'],['city.zh','中文城市'],['country.en','英文國家'],['country.zh','中文國家'],['slides_url','投影片 URL'],['show_upcoming','顯示 Upcoming','checkbox']],
visit:[['start_date','開始日期','date'],['end_date','結束日期','date'],['title.en','英文機構'],['title.zh','中文機構'],['city.en','英文城市'],['city.zh','中文城市'],['country.en','英文國家'],['country.zh','中文國家'],['visit_description.en','英文說明'],['visit_description.zh','中文說明'],['url','URL'],['show_upcoming','顯示 Upcoming','checkbox']],
honor:[['year','年份','number'],['title.en','英文名稱'],['title.zh','中文名稱'],['organization.en','英文頒發機構'],['organization.zh','中文頒發機構'],['url','URL']],
publication:[['date','日期','date'],['group_id','分類 ID'],['group_label.en','分類英文'],['group_label.zh','分類中文'],['title.en','英文題目'],['title.zh','中文題目'],['authors.en','英文作者'],['authors.zh','中文作者'],['venue.en','英文期刊／狀態'],['venue.zh','中文期刊／狀態'],['arxiv','arXiv ID'],['arxiv_url','arXiv URL'],['pdf_url','PDF URL'],['doi_url','DOI URL'],['journal_url','期刊頁 URL']],
teaching:[['term.en','英文學期'],['term.zh','中文學期'],['course.en','英文課名'],['course.zh','中文課名'],['institution.en','英文機構'],['institution.zh','中文機構'],['role.en','英文身分'],['role.zh','中文身分'],['group_id','機構群組 ID']]
};
function get(o,p){return p.split('.').reduce((a,k)=>a?.[k],o)} function set(o,p,v){let a=o,ks=p.split('.');ks.slice(0,-1).forEach(k=>a=a[k]??={});a[ks.at(-1)]=v}
function fields(type,obj={}){return schemas[type].map(([p,l,k='text'])=>`<div class="field"><label>${l}</label>${k==='checkbox'?`<input data-path="${p}" type="checkbox" ${get(obj,p)?'checked':''}>`:`<input data-path="${p}" type="${k}" value="${esc(get(obj,p)||'')}">`}</div>`).join('')}
function readForm(root,type){let raw={type};root.querySelectorAll('[data-path]').forEach(i=>set(raw,i.dataset.path,i.type==='checkbox'?i.checked:i.value));return makeObject(type,raw)}
function makeObject(t,r){let o=structuredClone(r), now=new Date().toISOString().slice(0,10);o.type=t;
for(const key of ['title','venue','city','country','event','visit_description','organization','authors','term','course','institution','role','group_label'])if(o[key])o[key]=pair(o[key].en,o[key].zh,key==='term');
if(['conference','talk','visit'].includes(t)){o.start_date=o.start_date||now;o.end_date=o.end_date||o.start_date;o.title_html=htmlPair(o.title||{});let parts=l=>t==='conference'?[o.venue?.[l],o.city?.[l],o.country?.[l]]:t==='talk'?[o.event?.[l],o.venue?.[l],o.city?.[l],o.country?.[l]]:[o.city?.[l],o.country?.[l]];o.description={en:parts('en').filter(Boolean).join(', '),zh:parts('zh').filter(Boolean).join(', ')};if(t==='visit'){for(const l of ['en','zh'])if(o.visit_description?.[l])o.description[l]+=(o.description[l]?' · ':'')+o.visit_description[l]}o.description_html=htmlPair(o.description)}
if(t==='honor'){o.year=Number(o.year)||new Date().getFullYear();o.title_html=htmlPair(o.title||{});o.organization_html=htmlPair(o.organization||{})}
if(t==='publication'){o.year=Number((o.date||now).slice(0,4));o.date=o.date||now;o.group_id=o.group_id||'preprints';o.title_html=htmlPair(o.title||{});o.authors_html=htmlPair(o.authors||{});o.venue_html=htmlPair(o.venue||{});o.links=[];[['arXiv',o.arxiv_url|| (o.arxiv?`https://arxiv.org/abs/${o.arxiv}`:'')],['PDF',o.pdf_url],['DOI',o.doi_url],['Journal',o.journal_url]].forEach(([x,u])=>{if(u)o.links.push({label:{en:x,zh:x},url:u})})}
if(t==='teaching'){o.group_id=o.group_id||slug(o.institution?.en||o.institution?.zh);o.order=999}
o.id=o.id||uid(t,o.start_date||o.date||o.year||o.term?.en||now,o.title?.en||o.title?.zh||o.course?.en||o.course?.zh);return o}
function title(x){return x.title?.zh||x.title?.en||x.course?.zh||x.course?.en||x.id}
function renderRecords(){let q=norm($('#search').value),f=$('#filter').value;$('#records').innerHTML=records.filter(x=>(!f||x.type===f)&&(!q||norm(JSON.stringify(x)).includes(q))).map(x=>`<div class="row"><span class="tag">${Z[x.type]}</span><strong>${esc(title(x))}</strong><span class="muted">${esc(x.id)}</span><div class="actions"><button class="button" data-edit="${x.id}">編輯草稿</button><button class="button danger" data-del="${x.id}">刪除草稿</button></div></div>`).join('')}
function save(){localStorage.setItem('hctsui-batch-v1',JSON.stringify(draft));renderDraft();renderPreview()}
function renderDraft(){$('#drafts').innerHTML=draft.length?draft.map((o,i)=>`<div class="row"><span class="tag">${o.op}</span><strong>${esc(title(o.after||o.before))}</strong><button class="button danger" data-drop="${i}">移除</button></div>`).join(''):'<p class="muted">尚無草稿。</p>'}
function renderPreview(){let adds=draft.filter(x=>x.op==='add').length,ups=draft.filter(x=>x.op==='update').length,dels=draft.filter(x=>x.op==='delete').length;$('#summary').textContent=`新增 ${adds}、修改 ${ups}、刪除 ${dels}`;$('#preview').innerHTML=draft.map(o=>`<div class="diff ${o.op==='add'?'added':o.op==='delete'?'deleted':''}"><strong>${Z[o.type]} · ${o.op}</strong><div>${esc(title(o.after||o.before))}</div>${o.op==='update'?`<details><summary>查看修改前後</summary><pre>${esc(JSON.stringify({before:o.before,after:o.after},null,2))}</pre></details>`:`<details><summary>查看完整物件</summary><pre>${esc(JSON.stringify(o.after||o.before,null,2))}</pre></details>`}</div>`).join('');$('#payload').textContent=JSON.stringify(payload(),null,2)}
function payload(){return{schema_version:1,created_at:new Date().toISOString(),operations:draft}}
function editRecord(id){let x=records.find(x=>x.id===id);let box=document.createElement('div');box.innerHTML=`<h3>編輯 ${esc(title(x))}</h3>${fields(x.type,x)}<button class="button primary">儲存修改</button>`;$('#preview').replaceChildren(box);box.querySelector('button').onclick=()=>{let after=readForm(box,x.type);after.id=x.id;draft=draft.filter(o=>!(o.id===x.id&&o.op==='update'));draft.push({op:'update',type:x.type,id:x.id,before:x,after});save();flash('已加入修改草稿')}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));['catalog','add','draft'].forEach(t=>$(`#${t}Tab`).hidden=t!==b.dataset.tab)})
$('#addType').innerHTML=$('#filter').innerHTML=TYPES.map(t=>`<option value="${t}">${Z[t]}</option>`).join('');function addFields(){$('#addFields').innerHTML=fields($('#addType').value)}$('#addType').onchange=addFields;addFields();
$('#addDraft').onclick=()=>{let x=readForm($('#addFields'),$('#addType').value);draft.push({op:'add',type:x.type,after:x});save();flash('已加入新增草稿')}
$('#records').onclick=e=>{let b=e.target.closest('button');if(b?.dataset.edit)editRecord(b.dataset.edit);if(b?.dataset.del){let x=records.find(x=>x.id===b.dataset.del);draft=draft.filter(o=>o.id!==x.id);draft.push({op:'delete',type:x.type,id:x.id,before:x});save();flash('已加入刪除草稿')}}
$('#drafts').onclick=e=>{let b=e.target.closest('[data-drop]');if(b){draft.splice(Number(b.dataset.drop),1);save()}}
$('#clearDraft').onclick=()=>{if(confirm('清空全部草稿？')){draft=[];save()}};$('#search').oninput=renderRecords;$('#filter').onchange=renderRecords;
async function copy(s){await navigator.clipboard.writeText(s);flash('已複製')}
$('#copyPayload').onclick=()=>copy(JSON.stringify(payload(),null,2));
$('#submitBatch').onclick=async()=>{if(!draft.length)return flash('尚無變更');let j=JSON.stringify(payload()),body=`### Batch payload / 批次資料\n\n\`\`\`json\n${j}\n\`\`\``;let url=repo+'/issues/new?title='+encodeURIComponent('[Website: Batch] '+new Date().toLocaleString('zh-TW'))+'&body='+encodeURIComponent(body);if(url.length<14000){window.open(url,'_blank','noopener')}else{await copy(JSON.stringify(payload(),null,2));window.open(repo+'/issues/new?template=batch-changes.yml','_blank','noopener');flash('資料較大：已複製，請貼入唯一欄位')}}
Promise.all([fetch('../content/site.json',{cache:'no-store'}).then(r=>r.json()),fetch('../content/translations.json',{cache:'no-store'}).then(r=>r.json())]).then(([s,d])=>{site=s;records=allRecords(s);for(const p of d.pairs||[]){dict.en.set(norm(p.en),p.zh);dict.zh.set(norm(p.zh),p.en)}renderRecords();renderDraft();renderPreview()}).catch(e=>flash('讀取網站資料失敗：'+e));
</script></body></html>
